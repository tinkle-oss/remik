version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule: {interval: weekly}
    groups:
      cargo-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions-compatible:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    groups:
      images-compatible:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
    groups:
      compose-compatible:
        update-types: [minor, patch]
