name: Benchmarks
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmarks
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'tinkle-oss/remik' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Criterion (informational)
        run: cargo bench --locked --bench core
      - name: End-to-end (equal quotas, preload, warmup, three alternating trials)
        run: scripts/benchmark.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            target/criterion
            benchmark-results
          retention-days: 30
          if-no-files-found: error
