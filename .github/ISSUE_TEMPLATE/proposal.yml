name: Feature request
description: Propose a scoped improvement and describe its observable behavior.
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities [privately](https://github.com/tinkle-oss/remik/security/advisories/new), not in this public issue.
        Never post passwords, secret-file contents, private keys, or private data values.
        Remik is memory-only and does not implement all Redis features; check [implemented compatibility](https://github.com/tinkle-oss/remik/blob/main/docs/compatibility.md). A request is not a commitment to implement a feature.
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues for this improvement.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing or difficult?
      placeholder: Describe the problem and who encounters it.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed behavior
      description: Describe the intended behavior, including syntax, results, or errors where relevant. A short explanation is enough for a small change.
      placeholder: What should users be able to do, and what should remain unchanged?
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives, costs, and risks (optional)
      description: Note workarounds or alternatives and any compatibility, memory, latency, security, or maintenance concerns.
  - type: textarea
    id: validation
    attributes:
      label: Validation ideas (optional)
      description: Suggest tests or evidence that would demonstrate the improvement. Performance claims need measurements.
